<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Monster Evolution: Chinese Radicals</title>
    <style>
        /* 🔥 核心升級：鎖死整個網頁的滾動，使用 100dvh 確保完美貼合手機螢幕 */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7fe; 
            color: #2d3748;
            margin: 0;
            padding: 0;
            height: 100dvh; 
            width: 100vw;
            display: flex;
            flex-direction: column;
            overscroll-behavior: none; 
            overflow: hidden; 
            user-select: none; 
            -webkit-user-select: none;
        }

        /* 頂部資訊列：不重疊、不浮動，乖乖待在最上面 */
        header {
            flex: 0 0 auto;
            padding: 10px 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            background: #ffffff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            z-index: 100;
            align-items: center;
            justify-content: space-between;
        }

        .header-top {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .stage-pill {
            background: linear-gradient(135deg, #a78bfa, #8b5cf6);
            color: white;
            padding: 6px 12px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 0.95rem;
            box-shadow: 0 4px 10px rgba(139, 92, 246, 0.3);
        }

        .progress-text {
            font-weight: bold; color: #4a5568; font-size: 1rem;
            display: flex; align-items: center; gap: 10px;
        }

        .timer-display {
            background: #edf2f7; padding: 4px 10px; border-radius: 8px;
            color: #2b6cb0; border: 2px solid #e2e8f0; font-size: 0.95rem;
        }

        .btn-group { display: flex; gap: 8px; margin-left: auto; }
        
        .action-btn {
            color: white; border: none; padding: 6px 12px;
            font-size: 0.95rem; border-radius: 8px; cursor: pointer;
            font-weight: bold; transition: all 0.2s;
        }
        #fullscreen-btn { background: #4299e1; box-shadow: 0 4px 10px rgba(66, 153, 225, 0.3); }
        #fullscreen-btn:hover { background: #3182ce; transform: translateY(-2px); }
        #end-game-btn { background: #e53e3e; box-shadow: 0 4px 10px rgba(229, 62, 62, 0.3); }
        #end-game-btn:hover { background: #c53030; transform: translateY(-2px); }

        .energy-container { display: flex; flex-direction: column; gap: 4px; min-width: 200px; flex: 1; }
        .energy-labels { display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: bold; color: #718096; }
        .energy-bar-bg { background-color: #e2e8f0; height: 12px; border-radius: 10px; overflow: hidden; position: relative; }
        .energy-bar-fill { background: linear-gradient(90deg, #ff7e5f, #feb47b); height: 100%; width: 0%; border-radius: 10px; transition: width 0.5s ease-out; }

        /* 🔥 遊戲主要區域：切割為「遊玩區(怪獸+鍋子)」與「積木區」 */
        #game-board {
            flex: 1 1 auto;
            display: flex;
            overflow: hidden; /* 遊戲大框架絕對禁止滾動 */
            padding: 10px;
            gap: 10px;
            box-sizing: border-box;
        }

        #play-area {
            display: flex;
            gap: 10px;
        }

        .panel {
            background: #ffffff; border-radius: 15px; padding: 10px;
            display: flex; flex-direction: column; align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.04); box-sizing: border-box;
        }

        #left-panel { flex: 1; justify-content: center; position: relative; background: transparent; box-shadow: none; }
        #center-panel { flex: 1; justify-content: flex-start; border: 3px dashed #cbd5e0; background: #f8fafc; }
        
        #right-panel { 
            flex: 1; display: flex; flex-direction: column; 
            background: #ffffff; border-radius: 15px; padding: 10px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.04); min-height: 0; min-width: 0;
        }

        .panel-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 5px; color: #2d3748; text-align: center; }
        .panel-subtitle { font-size: 0.8rem; color: #a0aec0; margin-bottom: 10px; text-align: center; }
        
        #cauldron { flex-grow: 1; width: 100%; border-radius: 15px; position: relative; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        #cauldron.highlight { background: rgba(246, 224, 94, 0.15); border: 2px solid #d69e2e; }

        /* 🔥 專屬滾動區：只有這裡可以上下滑動！ */
        #parts-container {
            flex: 1 1 auto; width: 100%; display: flex; flex-wrap: wrap; align-content: flex-start; 
            gap: 8px; overflow-y: auto; padding-right: 5px; padding-bottom: 30px; position: relative;
        }
        #parts-container::-webkit-scrollbar { width: 6px; }
        #parts-container::-webkit-scrollbar-thumb { background: #cbd5e0; border-radius: 3px; }

        .part {
            font-family: "DFKai-SB", "BiauKai", "KaiTi", "STKaiti", "楷體", serif;
            background: #48bb78; color: #ffffff; font-size: 1.8rem; font-weight: normal;
            width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;
            border-radius: 12px; box-shadow: 0 4px 0 #38a169, 0 6px 8px rgba(0,0,0,0.1); 
            touch-action: none; /* 🔥 禁止積木拖曳時觸發網頁滾動 */
            z-index: 10; transition: transform 0.1s, box-shadow 0.1s, background 0.15s; cursor: pointer;
        }

        .part:hover { background: #f6e05e; color: #2d3748; box-shadow: 0 4px 0 #d69e2e, 0 6px 8px rgba(0,0,0,0.1); }
        .part.dragging { box-shadow: 0 15px 25px rgba(214, 158, 46, 0.4); transform: scale(1.15) !important; z-index: 9999 !important; background: #f6e05e !important; border: 3px solid #d69e2e !important; color: #2d3748 !important; }

        /* =========================================
           🔥 手機直向模式 (App 級上下鎖定分割) 🔥
           ========================================= */
        @media (orientation: portrait) {
            #game-board { flex-direction: column; }
            /* 上半部鎖死高度，怪獸跟鍋子排排站 */
            #play-area { flex: 0 0 160px; flex-direction: row; }
            #left-panel { flex: 1; padding: 5px; }
            #center-panel { flex: 1.2; padding: 5px; }
            
            #monster-svg { width: 100px; height: 100px; }
            .speech-bubble { font-size: 0.75rem; padding: 4px 10px; margin-bottom: 2px; }
            .panel-title { font-size: 0.95rem; margin-bottom: 2px; }
            .panel-subtitle { display: none; } /* 隱藏副標題節省空間 */
        }

        /* =========================================
           🔥 手機橫向 / 電腦版模式 (左右完美排列) 🔥
           ========================================= */
        @media (orientation: landscape) {
            #game-board { flex-direction: row; }
            #play-area { flex-direction: row; flex: 2; }
            #right-panel { flex: 1.5; }
            #monster-svg { width: 160px; height: 160px; }
            .speech-bubble { font-size: 0.9rem; padding: 8px 15px; margin-bottom: 10px; }
            /* 如果橫向螢幕非常窄 (手機橫拿) */
            @media (max-height: 500px) {
                #monster-svg { width: 100px; height: 100px; }
                .speech-bubble { font-size: 0.75rem; padding: 4px 8px; margin-bottom: 5px; }
                .part { width: 45px; height: 45px; font-size: 1.5rem; }
            }
        }

        /* 動畫特效區 */
        .speech-bubble {
            background: white; border: 2px solid #e2e8f0; border-radius: 20px;
            font-weight: bold; color: #4a5568; position: relative;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05); text-align: center;
            animation: float 3s ease-in-out infinite; z-index: 20;
        }
        .speech-bubble::after { content: ''; position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%); border-width: 8px 8px 0; border-style: solid; border-color: white transparent transparent transparent; }
        .speech-bubble::before { content: ''; position: absolute; bottom: -11px; left: 50%; transform: translateX(-50%); border-width: 10px 10px 0; border-style: solid; border-color: #e2e8f0 transparent transparent transparent; z-index: -1; }

        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

        #monster-container { width: 100%; display: flex; justify-content: center; align-items: center; transition: all 0.3s; }
        #monster-svg { overflow: visible; }
        
        #monster-container .monster-part { opacity: 0; transition: opacity 0.8s ease; transform-origin: center; }
        #monster-container.monster-stage-1 .stage-1-part { opacity: 1; }
        #monster-container.monster-stage-2 .stage-1-part, #monster-container.monster-stage-2 .stage-2-part { opacity: 1; }
        #monster-container.monster-stage-3 .stage-1-part, #monster-container.monster-stage-3 .stage-2-part, #monster-container.monster-stage-3 .stage-3-part { opacity: 1; }
        #monster-container.monster-stage-4 .stage-1-part, #monster-container.monster-stage-4 .stage-2-part, #monster-container.monster-stage-4 .stage-3-part, #monster-container.monster-stage-4 .stage-4-part { opacity: 1; }

        #cute-face { display: block; }
        #angry-face { display: none; }
        #monster-container.monster-stage-4 #cute-face { display: none; }
        #monster-container.monster-stage-4 #angry-face { display: block; }
        #cute-mouth-open { display: none; }
        #monster-container.is-eating #cute-mouth-closed { display: none !important; }
        #monster-container.is-eating #cute-mouth-open { display: block !important; }

        @keyframes ragingFire { 0% { transform: scale(0.95) translateY(5px); filter: drop-shadow(0 0 10px #E53E3E); } 100% { transform: scale(1.05) translateY(-5px); filter: brightness(1.3) drop-shadow(0 0 30px #F6E05E); } }
        .fire-aura { transform-origin: center; animation: ragingFire 0.4s infinite alternate; }

        @keyframes starTwinkle { 0%, 100% { transform: scale(1) rotate(0deg); fill: #f6e05e; } 50% { transform: scale(1.2) rotate(20deg); fill: #fff382; } }
        .star-anim { transform-origin: center; animation: starTwinkle 1.5s infinite; }

        @keyframes happyJump { 0%, 100% { transform: translateY(0) scale(1); } 30% { transform: translateY(-25px) scale(1.05); } 50% { transform: translateY(0) scale(0.95); } 70% { transform: translateY(-12px) scale(1.02); } }
        .eating-anim { animation: happyJump 0.5s ease-out; }

        @keyframes combinePulse { 0% { transform: scale(1); filter: brightness(1); } 50% { transform: scale(1.5); filter: brightness(1.2); color: #f6e05e; border-color: #f6e05e; } 100% { transform: scale(1.2); filter: brightness(1); } }
        .success-anim { animation: combinePulse 0.5s forwards; z-index: 500; border: 3px solid #f6e05e !important; background: #48bb78 !important; color: white !important;}

        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
        .error-anim { animation: shake 0.4s; background: #fff5f5; border-color: #fc8181; color: #c53030; }

        @keyframes vanishAnim { 0% { transform: scale(1) rotate(0deg); opacity: 1; } 100% { transform: scale(0) rotate(180deg); opacity: 0; filter: blur(2px); } }
        .vanish-anim { animation: vanishAnim 0.4s forwards !important; pointer-events: none; }

        @keyframes respawnAnim { 0% { transform: scale(0); opacity: 0; } 80% { transform: scale(1.15); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
        .respawn-anim { animation: respawnAnim 0.4s forwards !important; }

        #modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; z-index: 3000; }
        #modal-box { background: white; padding: 30px; border-radius: 20px; text-align: center; width: 85%; max-width: 380px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        #modal-box h2 { color: #e53e3e; font-size: 1.8rem; margin-top: 0; margin-bottom: 10px; }
        .score-board { background: #f8fafc; border: 2px dashed #cbd5e0; border-radius: 12px; padding: 15px; margin-bottom: 20px; }
        .score-board p { margin: 5px 0; font-size: 1.2rem; font-weight: bold; color: #4a5568; }
        #modal-box input { font-size: 1.1rem; padding: 12px; margin: 10px 0 20px 0; width: 85%; border: 2px solid #e2e8f0; border-radius: 10px; text-align: center; outline: none; transition: 0.3s; }
        #modal-box input:focus { border-color: #8b5cf6; }
        #modal-submit-btn { background: linear-gradient(135deg, #a78bfa, #8b5cf6); color: white; border: none; padding: 12px 30px; font-size: 1.1rem; border-radius: 10px; cursor: pointer; font-weight: bold; width: 100%; }
        #play-again-btn { background: #48bb78; color: white; border: none; padding: 12px 30px; font-size: 1.1rem; border-radius: 10px; cursor: pointer; font-weight: bold; width: 100%; display: none; margin-top: 10px; }
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <div class="stage-pill" id="stage-indicator">Stage 0: Cute Egg</div>
            <div class="progress-text">
                <span><span id="score-count">0</span> / <span id="total-count">31</span></span>
                <span class="timer-display">⏱️ <span id="timer">00:00</span></span>
            </div>
            <div class="btn-group">
                <button id="fullscreen-btn" class="action-btn" onclick="toggleFullScreen()">⛶ 全螢幕</button>
                <button id="end-game-btn" class="action-btn" onclick="endGame(false)">🛑 結束</button>
            </div>
        </div>
        <div class="energy-container">
            <div class="energy-bar-bg">
                <div class="energy-bar-fill" id="energy-bar"></div>
            </div>
        </div>
    </header>

    <div id="game-board">
        <div id="play-area">
            <div id="left-panel" class="panel">
                <div class="speech-bubble" id="speech-bubble">Feed me!</div>
                <div id="monster-container" class="monster-stage-0">
                    <svg id="monster-svg" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <radialGradient id="bodyGrad" cx="30%" cy="30%" r="70%">
                                <stop offset="0%" stop-color="#48bb78" />
                                <stop offset="100%" stop-color="#276749" />
                            </radialGradient>
                            <radialGradient id="wingGrad" cx="50%" cy="50%" r="50%">
                                <stop offset="0%" stop-color="#9F7AEA" />
                                <stop offset="100%" stop-color="#553C9A" />
                            </radialGradient>
                        </defs>
                        <g class="monster-part stage-4-part fire-aura">
                            <path d="M 150 10 C 250 60 300 150 260 250 C 220 300 80 300 40 250 C 0 150 50 60 150 10 Z" fill="#E53E3E" opacity="0.9"/>
                            <path d="M 150 40 C 220 80 260 150 230 230 C 200 280 100 280 70 230 C 40 150 80 80 150 40 Z" fill="#DD6B20"/>
                            <path d="M 150 70 C 190 100 220 150 200 210 C 180 250 120 250 100 210 C 80 150 110 100 150 70 Z" fill="#F6E05E"/>
                        </g>
                        <g class="monster-part stage-2-part">
                            <path d="M 110 140 Q 30 50 10 90 Q 50 150 80 180 Z" fill="url(#wingGrad)" stroke="#4C1D95" stroke-width="3"/>
                            <path d="M 10 90 Q 20 120 60 150" stroke="#4C1D95" stroke-width="3" fill="none"/>

                            <path d="M 290 90 Q 280 120 240 150" stroke="#4C1D95" stroke-width="3" fill="none"/>
                        </g>
                        <g class="monster-part stage-3-part">
                            <rect x="110" y="200" width="25" height="35" rx="10" fill="url(#bodyGrad)" />
                            <rect x="165" y="200" width="25" height="35" rx="10" fill="url(#bodyGrad)" />
                            <rect x="60" y="150" width="40" height="18" rx="9" fill="url(#bodyGrad)" transform="rotate(30 80 159)" />
                            <rect x="200" y="150" width="40" height="18" rx="9" fill="url(#bodyGrad)" transform="rotate(-30 220 159)" />
                            <line x1="235" y1="165" x2="265" y2="100" stroke="#718096" stroke-width="4" stroke-linecap="round" />
                            <polygon points="265,85 270,98 284,98 273,107 277,120 265,112 253,120 257,107 246,98 260,98" fill="#F6E05E" class="star-anim" />
                        </g>
                        <circle cx="150" cy="150" r="70" fill="url(#bodyGrad)" />
                        <ellipse cx="150" cy="180" rx="40" ry="30" fill="#FDE047" /> 
                        <g class="monster-part stage-1-part">
                            <path d="M 115 100 Q 90 50 100 40 Q 125 70 130 90 Z" fill="#F6E05E" stroke="#B7791F" stroke-width="2"/>
                            <path d="M 185 100 Q 210 50 200 40 Q 175 70 170 90 Z" fill="#F6E05E" stroke="#B7791F" stroke-width="2"/>
                        </g>
                        <g id="cute-face">
                            <circle cx="150" cy="105" r="16" fill="white" />
                            <circle cx="150" cy="105" r="8" fill="#3E2723" />
                            <circle cx="147" cy="102" r="3" fill="white" />
                            <circle cx="115" cy="130" r="18" fill="white" />
                            <circle cx="120" cy="130" r="9" fill="#3E2723" />
                            <circle cx="117" cy="127" r="3" fill="white" />
                            <circle cx="185" cy="130" r="18" fill="white" />
                            <circle cx="180" cy="130" r="9" fill="#3E2723" />

                        <g id="angry-face" class="monster-part stage-4-part">
                            <circle cx="150" cy="105" r="16" fill="white" />
                            <circle cx="150" cy="105" r="7" fill="#c53030" />
                            <path d="M 135 95 L 165 95 L 150 80 Z" fill="url(#bodyGrad)" /> 
                            <circle cx="115" cy="130" r="18" fill="white" />
                            <circle cx="120" cy="130" r="8" fill="#c53030" />

                            <circle cx="185" cy="130" r="18" fill="white" />
                            <circle cx="180" cy="130" r="8" fill="#c53030" />

                            <path d="M 130 155 Q 150 195 170 155 Z" fill="#742A2A"/>
                            <path d="M 135 155 L 140 165 L 145 155 L 150 165 L 155 155 L 160 165 L 165 155 Z" fill="white"/>

                        </g>
                    </svg>
                </div>
            </div>

            <div id="center-panel" class="panel">
                <div class="panel-title">✨ Magic Drop Zone</div>
                <div id="cauldron"></div>
            </div>
        </div>

        <div id="right-panel">
            <div id="parts-container"></div>
        </div>
    </div>

    <div id="modal-overlay">
        <div id="modal-box">
            <h2 id="modal-title">🎉 終極進化完成！</h2>
            <div class="score-board">
                <p>🏆 答對題數：<span id="final-score" style="color: #e53e3e; font-size: 1.5rem;">0</span> / 31</p>
                <p>⏱️ 作答時間：<span id="final-time" style="color: #3182ce;">00:00</span></p>
            </div>
            <p style="color: #718096; font-weight: bold; margin-bottom: 5px;">請輸入你的名字傳給老師：</p>
            <input type="text" id="student-name" placeholder="例如：王小明">
            <button id="modal-submit-btn" onclick="submitScore()">送出成績</button>
            <button id="play-again-btn" onclick="location.reload()">再玩一次</button>

    <script>

            { result: "分", p1: "八", p2: "刀", layout: "TB", completed: false },
            { result: "啊", p1: "口", p2: "阿", layout: "LR", completed: false },
            { result: "多", p1: "夕", p2: "夕", layout: "TB", completed: false },
            { result: "玩", p1: "王", p2: "元", layout: "LR", completed: false },
            { result: "到", p1: "至", p2: "刂", layout: "LR", completed: false },
            { result: "課", p1: "言", p2: "果", layout: "LR", completed: false },
            { result: "拉", p1: "扌", p2: "立", layout: "LR", completed: false },
            { result: "看", p1: "龵", p2: "目", layout: "TB", completed: false },
            { result: "找", p1: "扌", p2: "戈", layout: "LR", completed: false },
            { result: "隻", p1: "隹", p2: "又", layout: "TB", completed: false },
            { result: "青", p1: "龶", p2: "月", layout: "TB", completed: false }
        ];
        
        const rawParts = [
            "扌", "白", "𠂇", "工", "𠂇", "口", "亻", "尔", "亻", "也", 
            "辶", "言", "言", "隹", "白", "勺", "禾", "火", "阝", "咅", 
            "咅", "阝", "氵", "每", "女", "子", "月", "月", "𠂇", "又", 
            "亻", "門", "走", "巳", "一", "大", "日", "月", "禾", "口",
            "八", "刀", "口", "阿", "夕", "夕", "王", "元", "至", "刂", 
            "言", "果", "扌", "立", "龵", "目", "扌", "戈", "隹", "又", 
            "龶", "月"
        ];
        
        const TOTAL_RECIPES = 31; 
        document.getElementById('total-count').innerText = TOTAL_RECIPES;

        const stages = [
            { score: 0, class: "monster-stage-0", name: "Stage 0: Cute Blob" },
            { score: 8, class: "monster-stage-1", name: "Stage 1: Growing Horns" },
            { score: 16, class: "monster-stage-2", name: "Stage 2: Winged Monster" },
            { score: 24, class: "monster-stage-3", name: "Stage 3: Magic Wand" },
            { score: 31, class: "monster-stage-4", name: "Stage 4: ON FIRE!!!" } 
        ];

        const standardCheers = [
            "太棒了！繼續保持！", "你做得超棒！", "完全正確！你太聰明了！",
            "幹得好！再給我一點！", "就是這樣拼！", "非常漂亮的組合！",
            "你真是個漢字天才！", "哇！你完美找出來了！"
        ];
        
        const stageUpCheers = [
            "哇！你看，我長出金牛角了！", 
            "太神奇了！我長出翅膀了！你最棒！", 
            "我有手腳了！繼續餵我吃字！", 
            "吼！！！我全身起火啦！！！滿分達成！" 
        ];

        const foods = ["🍎", "🍉", "🍇", "🍓", "🍒", "🍑", "🥦", "🥕", "🥑", "🌽", "🍍"];

        let score = 0;
        let currentStageIndex = 0;
        let mistakes = 0;
        let wrongRecords = []; 
        let cauldronParts = []; 
        
        let startTime = Date.now();
        let timerInterval = setInterval(() => {
            let diff = Math.floor((Date.now() - startTime) / 1000);
            let m = String(Math.floor(diff / 60)).padStart(2, '0');
            let s = String(diff % 60).padStart(2, '0');
            document.getElementById('timer').innerText = m + ':' + s;
        }, 1000);

        const partsContainer = document.getElementById('parts-container');
        function initParts() {
            partsContainer.innerHTML = '';
            let shuffled = rawParts.sort(() => Math.random() - 0.5);
            shuffled.forEach((char) => {
                let div = document.createElement('div');
                div.className = 'part';
                div.innerText = char;
                div.dataset.char = char;
                partsContainer.appendChild(div);
                bindDragEvents(div);
            });
        }
        initParts();

        function toggleFullScreen() {
            let elem = document.documentElement;
            let btn = document.getElementById('fullscreen-btn');
            
            try {
                if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                    if (elem.requestFullscreen) { elem.requestFullscreen(); } 
                    else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen(); }
                    btn.innerText = "✖ 退出全螢幕";
                } else {
                    if (document.exitFullscreen) { document.exitFullscreen(); } 
                    else if (document.webkitExitFullscreen) { document.webkitExitFullscreen(); }
                    btn.innerText = "⛶ 全螢幕";
                }
            } catch (err) {
                alert("抱歉，您的手機瀏覽器安全設定目前不支援全螢幕功能。");
            }
        }

        let draggedItem = null;
        const cauldron = document.getElementById('cauldron');

        function bindDragEvents(el) {
            el.addEventListener('mousedown', dragStart);
            el.addEventListener('touchstart', dragStart, { passive: false });
        }

        function dragStart(e) {
            e.preventDefault();
            draggedItem = e.target;
            draggedItem.classList.add('dragging');
            document.body.appendChild(draggedItem); 
            
            // 🔥 使用 Fixed 固定座標，不受任何滾動影響，徹底解決積木亂飛
            draggedItem.style.position = 'fixed';
            draggedItem.style.zIndex = '9999';
            moveAt(e);

            window.addEventListener('mousemove', dragMove);
            window.addEventListener('touchmove', dragMove, { passive: false });
            window.addEventListener('mouseup', dragEnd);
            window.addEventListener('touchend', dragEnd);
        }

        function moveAt(e) {
            let clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            let clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
            draggedItem.style.left = (clientX - draggedItem.offsetWidth/2) + 'px';
            draggedItem.style.top = (clientY - draggedItem.offsetHeight/2) + 'px';
        }

        function dragMove(e) {
            if (!draggedItem) return;
            e.preventDefault();
            moveAt(e);

            let clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            let clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
            let cauldronRect = cauldron.getBoundingClientRect();
            
            if (clientX > cauldronRect.left && clientX < cauldronRect.right &&
                clientY > cauldronRect.top && clientY < cauldronRect.bottom) {
                cauldron.classList.add('highlight');
            } else {
                cauldron.classList.remove('highlight');
            }
        }

        function dragEnd(e) {
            if (!draggedItem) return;
            let clientX = e.type.includes('mouse') ? e.clientX : e.changedTouches[0].clientX;
            let clientY = e.type.includes('mouse') ? e.clientY : e.changedTouches[0].clientY;

            let cauldronRect = cauldron.getBoundingClientRect();
            draggedItem.classList.remove('dragging');
            cauldron.classList.remove('highlight');

            if (clientX > cauldronRect.left && clientX < cauldronRect.right &&
                clientY > cauldronRect.top && clientY < cauldronRect.bottom) {
                
                if (draggedItem.parentElement !== cauldron) {
                    cauldron.appendChild(draggedItem);
                    cauldronParts.push(draggedItem);
                }
                
                draggedItem.style.position = 'absolute'; // 進鍋子後改回相對定位
                draggedItem.style.left = (clientX - cauldronRect.left - draggedItem.offsetWidth/2) + 'px';
                draggedItem.style.top = (clientY - cauldronRect.top - draggedItem.offsetHeight/2) + 'px';
                
                if (cauldronParts.length === 2) {
                    setTimeout(checkRecipe, 150); 
                }
            } else {
                resetPart(draggedItem);
            }

            window.removeEventListener('mousemove', dragMove);
            window.removeEventListener('touchmove', dragMove);
            window.removeEventListener('mouseup', dragEnd);
            window.removeEventListener('touchend', dragEnd);
            draggedItem = null;
        }

        function resetPart(part) {
            let children = partsContainer.children;
            if (children.length > 0) {
                let randomIndex = Math.floor(Math.random() * children.length);
                partsContainer.insertBefore(part, children[randomIndex]);
            } else {
                partsContainer.appendChild(part);
            }
            
            part.style.position = '';
            part.style.left = '';
            part.style.top = '';
            let idx = cauldronParts.indexOf(part);
            if (idx > -1) cauldronParts.splice(idx, 1);
        }

        function checkRecipe() {
            if (cauldronParts.length < 2) return;
            let pA = cauldronParts[0];
            let pB = cauldronParts[1];
            
            let charA = pA.dataset.char;
            let charB = pB.dataset.char;

            let rectA = pA.getBoundingClientRect();
            let rectB = pB.getBoundingClientRect();
            let cxA = rectA.left + rectA.width/2;
            let cyA = rectA.top + rectA.height/2;
            let cxB = rectB.left + rectB.width/2;
            let cyB = rectB.top + rectB.height/2;

            let matchedRecipe = null;

            for (let r of recipes) {
                if (!r.completed && ((r.p1 === charA && r.p2 === charB) || (r.p1 === charB && r.p2 === charA))) {
                    let A_is_p1 = (charA === r.p1);
                    let node1_cx = A_is_p1 ? cxA : cxB;
                    let node1_cy = A_is_p1 ? cyA : cyB;
                    let node2_cx = A_is_p1 ? cxB : cxA;
                    let node2_cy = A_is_p1 ? cyB : cyA;

                    let isValid = false;
                    
                    if (r.p1 === r.p2) {
                        isValid = true;
                    } else {
                        // 🔥 終極寬鬆的吸附判定，確保「天」字完美結合
                        if (r.layout === "LR") {
                            if (node1_cx < node2_cx + 60) isValid = true; 
                        } else if (r.layout === "TB") {
                            if (node1_cy < node2_cy + 60) isValid = true; 
                        }
                    }

                    if (isValid) {
                        matchedRecipe = r;
                        break;
                    }
                }
            }

            if (matchedRecipe) {
                matchedRecipe.completed = true;

                pA.innerText = matchedRecipe.result;
                pA.classList.add('success-anim');
                pB.style.display = 'none';

                setTimeout(() => {
                    pA.innerText = foods[Math.floor(Math.random() * foods.length)];
                    pA.style.background = "transparent";
                    pA.style.border = "none";
                    pA.style.boxShadow = "none";
                    pA.style.fontSize = "3.5rem";
                    pA.style.cursor = "default";

                    let monsterContainer = document.getElementById('monster-container');
                    let monsterRect = monsterContainer.getBoundingClientRect();
                    let pARect = pA.getBoundingClientRect();
                    
                    let moveX = (monsterRect.left + monsterRect.width/2) - (pARect.left + pARect.width/2);
                    let moveY = (monsterRect.top + monsterRect.height/2) - (pARect.top + pARect.height/2);

                    pA.style.transition = 'all 0.5s cubic-bezier(0.5, 0, 0.2, 1)';
                    pA.style.transform = `translate(${moveX}px, ${moveY}px) scale(0.5)`;
                    pA.style.opacity = '0';

                    setTimeout(() => { monsterContainer.classList.add('is-eating'); }, 300);

                    setTimeout(() => {
                        pA.remove();
                        pB.remove();
                        cauldronParts = [];
                        
                        score++;
                        document.getElementById('score-count').innerText = score;
                        
                        monsterContainer.classList.add('eating-anim');
                        setTimeout(() => {
                            monsterContainer.classList.remove('eating-anim');
                            monsterContainer.classList.remove('is-eating'); 
                        }, 500);

                        updateProgress();
                        
                        if(score === TOTAL_RECIPES) {
                            clearInterval(timerInterval);
                            setTimeout(() => {
                                endGame(true);
                            }, 3000); 
                        }
                    }, 600);
                }, 800);

            } else {
                mistakes++;
                let dx = cxB - cxA;
                let dy = cyB - cyA;
                let errorLabel = Math.abs(dx) > Math.abs(dy) ? "L/R" : "T/B";
                wrongRecords.push(`${charA}+${charB}(${errorLabel})`); 

                cauldron.classList.add('error-anim');
                document.getElementById('speech-bubble').innerText = "哎呀！拼錯了，部件已退回！";
                
                // 🔥 確保兩個部件「一起」旋轉縮小消失
                pA.classList.add('vanish-anim');
                pB.classList.add('vanish-anim');
                
                setTimeout(() => {
                    cauldron.classList.remove('error-anim');
                    
                    pA.classList.remove('vanish-anim');
                    pB.classList.remove('vanish-anim');

                    resetPart(pA);
                    resetPart(pB);
                    cauldronParts = [];

                    // 🔥 回到積木區「一起」彈出重生
                    pA.classList.add('respawn-anim');
                    pB.classList.add('respawn-anim');
                    setTimeout(() => {
                        pA.classList.remove('respawn-anim');
                        pB.classList.remove('respawn-anim');
                    }, 400);

                }, 400); 
            }
        }

        function updateProgress() {
            let percent = Math.floor((score / TOTAL_RECIPES) * 100);
            document.getElementById('energy-percent').innerText = percent + "%";
            document.getElementById('energy-bar').style.width = percent + "%";

            let newStageIndex = 0;
            for (let i = stages.length - 1; i >= 0; i--) {
                if (score >= stages[i].score) {
                    newStageIndex = i;
                    break;
                }
            }

            if (newStageIndex > currentStageIndex) {
                document.getElementById('speech-bubble').innerText = stageUpCheers[newStageIndex - 1];
                currentStageIndex = newStageIndex;
                let monsterContainer = document.getElementById('monster-container');
                monsterContainer.className = stages[currentStageIndex].class;
            } else if (score < TOTAL_RECIPES) {
                document.getElementById('speech-bubble').innerText = standardCheers[Math.floor(Math.random() * standardCheers.length)];
            }

            document.getElementById('stage-indicator').innerText = stages[currentStageIndex].name;
        }

        function endGame(isWin) {
            clearInterval(timerInterval); 
            document.getElementById('modal-overlay').style.display = 'flex';
            
            document.getElementById('final-score').innerText = score;
            document.getElementById('final-time').innerText = document.getElementById('timer').innerText;

            if(isWin) {
                document.getElementById('modal-title').innerText = "🔥 終極進化完成！ 🔥";
            } else {
                document.getElementById('modal-title').innerText = "🏁 遊戲結束！";
                document.getElementById('modal-title').style.color = "#4a5568";
            }
        }

        function submitScore() {
            let name = document.getElementById('student-name').value;
            if(!name) { alert("請輸入你的名字！"); return; }
            
            let btn = document.getElementById('modal-submit-btn');
            btn.innerText = "傳送中...";
            btn.disabled = true;

            const formData = new URLSearchParams();
            formData.append('score', score); 
            formData.append('name', name);
            formData.append('studentName', name);
            formData.append('學生姓名', name);
            
            let wrongDetail = wrongRecords.length > 0 ? `${mistakes} mistakes (${wrongRecords.join(', ')})` : "Perfect";
            formData.append('wrongAnswers', wrongDetail); 
            formData.append('mistakes', wrongDetail);
            formData.append('錯題紀錄', wrongDetail);
            
            let timeString = document.getElementById('timer').innerText;
            formData.append('timeTaken', timeString); 
            formData.append('作答時間', timeString); 
            
            formData.append('gameName', 'Monster Evolution Final');

            fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors', 
                body: formData
            }).then(() => {
                document.getElementById('submit-msg').innerText = "✅ 成績已成功傳送給老師！";
                document.getElementById('submit-msg').style.color = "#48bb78";
                btn.style.display = "none";
                document.getElementById('play-again-btn').style.display = "inline-block";
            }).catch(err => {
                console.error(err);
                document.getElementById('submit-msg').innerText = "❌ 傳送失敗，請檢查網路連線。";
                document.getElementById('submit-msg').style.color = "#fc8181";
                btn.innerText = "再試一次";
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
